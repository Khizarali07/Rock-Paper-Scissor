<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nav">Rock Paper Scissors</div>

    <div id="main">
            <img src="Rock.jpg" alt="Rock" onclick="game('rock')">
            <img src="Paper.jpg" alt="Paper" onclick="game('paper')">
            <img src="Scissor.jpg" alt="Scissor" onclick="game('scissor')">
    </div>

    <div id="score">
    <div id="you">
        <p id="data1">0</p>
        <p>You</p>
    </div>
    <div id="comp">
        <p id="data2">0</p>
        <p>Comp</p>
    </div>
    </div>

    <div id="footer">
    <p id="message">Pick your move</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
